<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Jackson Wearn" />
    <meta name="description" content="Welcome to the Slug Zone.  You can never leave" />
    <meta name="keywords" content="Slug,zone,Slug Zone" />
    <title>Slug Zone</title>

    <link rel="icon" type="image/x-icon" href="dist/images/favicon.ico" />
    <link rel="stylesheet" type="text/css" href="dist/css/style.css" />

    <!--
      Press Start 2P is the whole visual identity of this page. Preconnect
      because it is render-blocking and on the critical path; the CSS declares
      `cursive` after it so a blocked Google Fonts still leaves something
      legible rather than a system sans-serif.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>

  <body id="page-top">
    <!--
      Static markup, deliberately. This is the DOM React used to render at
      runtime from a 1.19 MB unminified dev bundle, for a page with six words
      on it. #root is kept as the outer element because every CSS rule hangs
      off it.

      The game itself lives on Cloudflare Pages, over HTTPS, which this domain
      has never had -- so both links leave the site on purpose. When the
      nameservers move to Cloudflare this page stops being the front door and
      can go away entirely.
    -->
    <div id="root">
      <div class="aligner">
        <div>
          <a class="text coming-soon" href="https://slug-zone.pages.dev/game/"
            >It's finally here</a
          >
          <div><img src="dist/images/slug.png" alt="Slug" /></div>
          <a class="text play" href="https://slug-zone.pages.dev/game/">PLAY</a>
        </div>

        <div class="text signature">slug.zone</div>
      </div>
    </div>
  </body>
</html>
